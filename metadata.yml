Identifier: eos8v1a
Slug: antimicrobial-activity-smansoni
Status: Ready
Title: Antimicrobial activity prediction against Schistosoma mansoni from public
  ChEMBL data
Description: Bioactivity prediction of growth inhibition in Schistosoma mansoni,
  trained as binary (active/inactive) classifiers from publicly available data 
  in ChEMBL. Independent models are trained on multiple bioactivity datasets, 
  corresponding to single-point (Inhibition) and dose-response (IC50) assays, 
  among others. A ranking score is provided for each model alongside a combined 
  consensus score.
