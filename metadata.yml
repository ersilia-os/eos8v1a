Identifier: eos8v1a
Slug: antimicrobial-activity-smansoni
Status: Ready
Title: Antimicrobial activity prediction against Schistosoma mansoni from public
  ChEMBL data
Description: Scores compounds against Schistosoma mansoni, a parasitic flatworm infecting
  hundreds of millions of people and treated almost entirely with a single drug, praziquantel.
  Four classifiers were built from the ChEMBL bioactivity pools with enough data to
  support them, then combined into a quality-weighted consensus. Helminths are multicellular
  animals rather than microbes, so activity depends on tissue penetration in ways
  that bacterial screening intuition does not transfer to.
